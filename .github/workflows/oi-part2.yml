name: NSE OI - Part 2 (12:25 to 15:30)

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: oi-tracker-part2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Part 1 ka data aane ka wait karo
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%F)
          DEADLINE=$(TZ=Asia/Kolkata date -d "12:23" +%s)
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            git pull --rebase --autostash || true
            if [ -f "data/NSE_OI_${TODAY}.xlsx" ]; then
              echo "Part 1 ka data mil gaya"
              exit 0
            fi
            echo "Part 1 abhi chal raha hai... 60 sec wait"
            sleep 60
          done
          echo "::warning::Part 1 ka data nahi mila - baseline NSE ke prevOI se dubara lock hoga"

      - name: Collect OI data (12:25 - 15:30) + CONCLUSION
        env:
          OI_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python nse_oi_tracker.py

      - name: Commit data to repo
        if: always()
        run: |
          git config user.name  "oi-bot"
          git config user.email "oi-bot@users.noreply.github.com"
          mkdir -p data
          git add -f data/
          git diff --staged --quiet || git commit -m "OI data part 2 + conclusion - $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase --autostash || true
          git push
