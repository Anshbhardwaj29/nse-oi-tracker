name: NSE OI - Part 1 (9:15 to 12:20)

"on":
  schedule:
    # 08:45 IST = 03:15 UTC. Jaldi start isliye kyunki GitHub ka cron
    # 5-20 min late ho sakta hai; script khud 9:15 tak wait karti hai.
    - cron: '15 3 * * 1-5'
  workflow_dispatch:        # manual run button

concurrency:
  group: oi-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect OI data (9:15 - 12:20)
        env:
          OI_OUTPUT_DIR: ${{ github.workspace }}/data
        run: python nse_oi_tracker.py --until 12:20 --no-conclusion

      - name: Commit data to repo
        if: always()
        run: |
          git config user.name  "oi-bot"
          git config user.email "oi-bot@users.noreply.github.com"
          mkdir -p data
          git add -f data/
          git diff --staged --quiet || git commit -m "OI data part 1 - $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase --autostash || true
          git push
